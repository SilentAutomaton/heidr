# Copy to ~/.config/heidr/keymap.toml and edit.
# Keys follow the neovim notation: <C-w> is control and w, <leader> is the
# leader key set below.

leader = "space"

[normal]
":" = "command_line"
"i" = "ask"
"h" = "pane_left"
"j" = "pane_down"
"k" = "pane_up"
"l" = "pane_right"
"<Tab>" = "pane_next"
"<C-w>s" = "split_horizontal"
"<C-w>v" = "split_vertical"
"-" = "volume_down"
"+" = "volume_up"
"m" = "mute"
"g?" = "help"

[insert]
"<Esc>" = "normal_mode"
"<C-v>" = "voice_input"

[leader]
"a" = "ask"
"d" = "draw"
"l" = "ledger"
"m" = "modules"
"s" = "settings"
"h" = "checkhealth"

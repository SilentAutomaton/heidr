# Copy to ~/.config/heidr/keymap.toml and edit.
# Key names are the ones Textual reports: "colon", "minus", "tab", "escape",
# "ctrl+v", "question_mark". The leader key is set below.

leader = "space"

[normal]
"colon" = "command_line"
# Six ways into the question field, as vim has six ways into insert.
"i" = "ask"
"a" = "ask"
"A" = "ask"
"I" = "ask"
"o" = "ask"
"O" = "ask"
"h" = "value_previous"
"j" = "line_down"
"k" = "line_up"
"l" = "value_next"
"up" = "line_up"
"down" = "line_down"
# The keys everybody else knows, beside the vim ones rather than instead.
"tab" = "line_down"
"shift+tab" = "line_up"
"home" = "first_line"
"end" = "last_line"
"insert" = "ask"
"backspace" = "back"
"f1" = "help"
"f3" = "search_next"
"shift+f3" = "search_previous"
"ctrl+s" = "write"
"ctrl+z" = "undo"
"ctrl+y" = "redo"
"ctrl+c" = "stop_or_quit"
"left" = "value_previous"
"right" = "value_next"
"pageup" = "page_up"
"pagedown" = "page_down"
"ctrl+f" = "page_down"
"ctrl+b" = "page_up"
"ctrl+d" = "half_page_down"
"ctrl+u" = "half_page_up"
"G" = "last_line"
"left_curly_bracket" = "section_up"
"right_curly_bracket" = "section_down"
"ctrl+o" = "back"
"slash" = "search"
"n" = "search_next"
"N" = "search_previous"
"y" = "yank"
"u" = "undo"
"ctrl+r" = "redo"
"enter" = "choose"
"minus" = "volume_down"
"plus" = "volume_up"
"equals_sign" = "volume_up"
"m" = "mute"
"question_mark" = "help"
"escape" = "stop"      # interrupt a running draw

[insert]
"escape" = "normal_mode"
"ctrl+v" = "voice_input"

# Keys that wait for a second one, each its own section. Ctrl-W and Ctrl-U
# while typing delete a word and the line; they belong to the line itself and
# are not rebound here.
[g]
"g" = "first_line"

[Z]
"Z" = "write_and_quit"
"Q" = "quit"

[leader]
"a" = "ask"
"c" = "compose"
"d" = "draw"
"l" = "ledger"
"m" = "modules"
"s" = "settings"
"h" = "checkhealth"
"q" = "quit"

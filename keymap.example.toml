# Copy to ~/.config/heidr/keymap.toml and edit.
# Key names are the ones Textual reports: "colon", "minus", "tab", "escape",
# "ctrl+v", "question_mark". The leader key is set below.

leader = "space"

[normal]
"colon" = "command_line"
"i" = "ask"
"h" = "pane_left"
"j" = "pane_down"
"k" = "pane_up"
"l" = "pane_right"
"tab" = "pane_next"
"minus" = "volume_down"
"plus" = "volume_up"
"equals_sign" = "volume_up"
"m" = "mute"
"question_mark" = "help"

[insert]
"escape" = "normal_mode"
"ctrl+v" = "voice_input"

[leader]
"a" = "ask"
"d" = "draw"
"l" = "ledger"
"m" = "modules"
"s" = "settings"
"h" = "checkhealth"
"q" = "quit"

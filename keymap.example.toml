# Copy to ~/.config/heidr/keymap.toml and edit.
# Key names are the ones Textual reports: "colon", "minus", "tab", "escape",
# "ctrl+v", "question_mark". The leader key is set below.

leader = "space"

[normal]
"colon" = "command_line"
"i" = "ask"
"h" = "value_previous"
"j" = "line_down"
"k" = "line_up"
"l" = "value_next"
"up" = "line_up"
"down" = "line_down"
"left" = "value_previous"
"right" = "value_next"
"pageup" = "page_up"
"pagedown" = "page_down"
"enter" = "choose"
"minus" = "volume_down"
"plus" = "volume_up"
"equals_sign" = "volume_up"
"m" = "mute"
"question_mark" = "help"
"escape" = "stop"      # interrupt a running draw

[insert]
"escape" = "normal_mode"
"ctrl+v" = "voice_input"

[leader]
"a" = "ask"
"d" = "draw"
"l" = "ledger"
"m" = "modules"
"s" = "settings"
"h" = "checkhealth"
"q" = "quit"

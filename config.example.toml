# Copy to ~/.config/heidr/config.toml and edit.
# Every value here is a default; delete a line to keep the built-in value.
# API keys are never read from this file, only from environment variables.

[ui]
theme = "auto"          # auto, full, tty
language = "en"
splash = true

[audio]
volume = 0.6            # 0.0 to 1.0, also bound to - and + in the interface
target_rms = 0.12       # level the automatic gain control aims for
limiter_ceiling = 0.95  # hard ceiling, never exceeded
attack_ms = 50
release_ms = 400

[llm]
provider = "ollama"     # ollama, openai_compat, anthropic
model = "qwen3.5:9B"
base_url = "http://localhost:11434"
api_key_env = "HEIDR_LLM_KEY"
think = false           # ollama only: let a reasoning model think before it answers

[stt]
provider = "vosk"       # vosk, whisper_cpp, api
model_path = ""         # directory for vosk, .bin file for whisper.cpp
api_key_env = "HEIDR_STT_KEY"
language = "auto"
window_s = 30           # whisper.cpp window length, its native size
threads = 0             # 0 lets whisper.cpp decide
binary = ""             # empty finds whisper-cli on the path

# For radio, a bigger model earns its keep: on a short noisy fragment small
# invents about half of what it reports. ggml-large-v3-turbo-q5_0.bin is the
# sensible default, ggml-medium.bin the cheaper one.

[history]
path = "~/.local/share/heidr"   # typed commands and questions, kept apart

[rite]
silence_chance = 0.125  # how often the oracle refuses to answer
recent_penalty = 4      # weight divisor for modules drawn in the last three rites

[ledger]
path = "~/.local/share/heidr/ledger"

# Per module settings. The section name is the module name.
[modules.fm_voice]
band = "88.0-108.0"
sweep = "random"        # forward, backward, bounce, random
stops = 4
dwell_s = 15
tuned = true            # scan for carriers before dwelling

[modules.sw_voice]
# One of these metre bands is drawn per sweep; which of them is alive
# depends on the hour and the ionosphere.
band = ["5.85-6.20", "7.20-7.45", "9.40-9.90", "11.60-12.10", "15.10-15.80"]
stops = 3
dwell_s = 20
direct = "direct2"      # a tuner cannot reach shortwave

[modules.mw_voice]
band = "0.531-1.602"
stops = 3
dwell_s = 20
direct = "direct2"

[modules.sky]
# Your position. Without it the sky module stays out of the lottery.
latitude = 0.0
longitude = 0.0
radius_nm = 50

[modules.chain]
messages = 5

[modules.tarot]
spread = "three"        # one, three
reversals = true

[modules.iching]
corpus = ""             # path to your own hexagram texts

[modules.rtl_peak]
band = "88M:108M"
step = "100k"
seconds = 20

[modules.ism]
frequency = "433.92M"
seconds = 45

[modules.adsb_local]
# dump1090 must already be running and serving BaseStation format.
host = "127.0.0.1"
port = 30003
seconds = 45

[modules.sdr_noise]
frequency = "88000000"  # something with nothing on it
seconds = 3.0

[modules.planetary]
# Without a position the planetary hours rite stays out of the lottery.
latitude = 0.0
longitude = 0.0

[modules.calendar]
which = "rotate"        # discordian, republican, long_count, or rotate daily

[modules.embed]
model = "nomic-embed-text"

[modules.hline]
seconds = 30            # integration time; longer is cleaner
step = "10k"

[modules.apt]
satellite = "noaa-19"   # noaa-15, noaa-18, noaa-19
seconds = 600           # start a draw during a pass; there is no predictor

name: build-binaries

# One workflow builds every released binary. A PyInstaller binary has to be
# built on the architecture it runs under — it packages the interpreter and
# the prebuilt wheels, it does not compile — so each target gets its own
# runner. Public repositories get all of these for free.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to build, for example v0.2.1"
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runs-on: windows-latest, os: windows, arch: x86_64 }
          - { runs-on: macos-15, os: macos, arch: arm64 }
          - { runs-on: macos-15-large, os: macos, arch: x86_64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller ".[audio,effects]"
      - run: pyinstaller --clean heidr.spec
      - uses: actions/upload-artifact@v4
        with:
          name: heidr-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/heidr*
          if-no-files-found: error
